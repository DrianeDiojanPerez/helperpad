[package]
name = "helperpad"
version = "0.2.2"
edition = "2024"
rust-version = "1.95"

[dependencies]
aes = "0.8"
base64 = "0.23.1"
cbc = { version = "0.1", features = ["block-padding"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2.191"
rand = "0.8"
rsa = "0.9"
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tiny-skia = "0.12.0"
ureq = "3"
